<style>
  /* ===== 색과 글꼴 ===== */
  :root {
    --ai:      #16233d;   /* 藍 — 배경 인디고 */
    --washi:   #f2ede3;   /* 生成り — 종이 카드 */
    --washi-2: #e5ddcd;
    --sumi:    #23201c;   /* 墨 — 먹 글씨 */
    --shu:     #d93e30;   /* 朱 — 하나마루 빨강 */
    --take:    #5b8c6e;   /* 若竹 — 대나무 초록 */
    --mist:    rgba(242,237,227,.55);

    --mincho: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
    --sans:   "Noto Sans KR", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ai);
    color: var(--washi);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 64px; }

  /* ===== 머리말 ===== */
  .masthead {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; padding-bottom: 18px;
    border-bottom: 1px solid rgba(242,237,227,.18);
  }
  .brand-jp {
    font-family: var(--mincho); font-weight: 700; font-size: 34px;
    letter-spacing: .18em; line-height: 1; margin: 0;
  }
  .brand-ko { font-size: 12px; letter-spacing: .22em; color: var(--mist); margin: 9px 0 0; }
  .tally {
    font-family: var(--mincho); font-size: 13px; color: var(--mist);
    text-align: right; line-height: 1.5; white-space: nowrap;
  }
  .tally b { display: block; font-size: 26px; color: var(--washi); font-weight: 700; }

  /* ===== 탭 ===== */
  .tabs { display: flex; gap: 26px; margin: 22px 0 20px; }
  .tab {
    background: none; border: 0; padding: 0 0 8px;
    font-family: var(--sans); font-size: 15px; font-weight: 500;
    color: var(--mist); cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--washi); border-bottom-color: var(--shu); }
  .tab:focus-visible { outline: 2px solid var(--shu); outline-offset: 4px; }

  .panel[hidden] { display: none; }

  /* ===== 갈래 고르기 ===== */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    background: transparent; border: 1px solid rgba(242,237,227,.24);
    color: var(--mist); border-radius: 999px;
    padding: 7px 15px; font-family: var(--sans); font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--washi); border-color: var(--washi); color: var(--ai); font-weight: 700;
  }
  .chip:focus-visible { outline: 2px solid var(--shu); outline-offset: 3px; }

  /* ===== 단어 넣는 곳 ===== */
  .composer {
    background: rgba(0,0,0,.16); border: 1px solid rgba(242,237,227,.14);
    border-radius: 4px; padding: 18px; margin-bottom: 24px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 11px; letter-spacing: .16em;
    color: var(--mist); margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; background: transparent; border: 0;
    border-bottom: 1px solid rgba(242,237,227,.28);
    color: var(--washi); font-family: var(--sans); font-size: 17px; padding: 5px 0;
  }
  .field select option { background: var(--ai); }
  .field input#f-word { font-family: var(--mincho); font-size: 21px; }
  .field input:focus, .field select:focus { outline: 0; border-bottom-color: var(--shu); }
  .field input::placeholder { color: rgba(242,237,227,.3); }

  .add-btn {
    width: 100%; margin-top: 6px; padding: 12px;
    background: var(--shu); color: #fff; border: 0; border-radius: 3px;
    font-family: var(--sans); font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:focus-visible { outline: 2px solid var(--washi); outline-offset: 3px; }

  .note { font-size: 12px; color: var(--mist); margin: 10px 0 0; min-height: 16px; }

  /* ===== 단어 목록 ===== */
  .list { list-style: none; margin: 0; padding: 0; }
  .row {
    display: flex; align-items: baseline; gap: 12px;
    padding: 15px 2px; border-bottom: 1px solid rgba(242,237,227,.1);
  }
  .row .jp { font-family: var(--mincho); font-size: 22px; line-height: 1.2; }
  .row .kana { font-family: var(--mincho); font-size: 12px; color: var(--mist); }
  .row .ko { margin-left: auto; font-size: 14px; color: rgba(242,237,227,.82); text-align: right; }
  .row .del {
    background: none; border: 0; color: rgba(242,237,227,.32);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px;
  }
  .row .del:hover { color: var(--shu); }
  .marks { font-size: 11px; color: var(--take); letter-spacing: .1em; }
  .tag {
    font-family: var(--mincho); font-size: 11px;
    color: rgba(242,237,227,.34); border: 1px solid rgba(242,237,227,.18);
    border-radius: 2px; padding: 1px 5px;
  }

  .empty {
    padding: 44px 8px; text-align: center;
    color: var(--mist); font-size: 14px; line-height: 1.9;
  }
  .empty .big {
    display: block; font-family: var(--mincho); font-size: 30px;
    color: rgba(242,237,227,.3); margin-bottom: 14px; letter-spacing: .2em;
  }

  /* ===== 시험 카드 ===== */
  .stage { perspective: 1200px; }
  .card {
    position: relative; width: 100%; min-height: 260px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.22,.7,.3,1);
    border: 0; padding: 0; background: none; font: inherit; display: block;
  }
  .card.is-flipped { transform: rotateY(180deg); }
  .card:focus-visible { outline: 2px solid var(--shu); outline-offset: 6px; }

  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    background: var(--washi); color: var(--sumi); border-radius: 3px;
    box-shadow: 0 14px 34px rgba(0,0,0,.34);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 24px; text-align: center;
  }
  .face.back { transform: rotateY(180deg); background: var(--washi-2); }

  .face .kana-top {
    font-family: var(--mincho); font-size: 14px; color: rgba(35,32,28,.5);
    letter-spacing: .14em; margin-bottom: 12px; min-height: 20px;
  }
  .face .word {
    font-family: var(--mincho); font-weight: 700;
    font-size: clamp(38px, 12vw, 58px); line-height: 1.15; letter-spacing: .04em;
  }
  .face .meaning { font-size: clamp(21px, 6vw, 27px); font-weight: 500; line-height: 1.4; }
  .face .hint {
    position: absolute; bottom: 16px; font-size: 11px;
    letter-spacing: .16em; color: rgba(35,32,28,.38);
  }

  /* 花丸 — 맞혔을 때 찍히는 도장 */
  .hanamaru {
    position: absolute; top: 50%; left: 50%;
    width: 190px; height: 190px; margin: -95px 0 0 -95px;
    pointer-events: none; opacity: 0; z-index: 3;
  }
  .hanamaru path {
    fill: none; stroke: var(--shu); stroke-width: 5;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .hanamaru.draw { opacity: .9; animation: stampOut 1.05s ease forwards; }
  .hanamaru.draw path {
    stroke-dasharray: 620; stroke-dashoffset: 620;
    animation: ink .52s ease-out forwards;
  }
  .hanamaru.draw path.spiral { animation-delay: .3s; }
  @keyframes ink { to { stroke-dashoffset: 0; } }
  @keyframes stampOut {
    0%   { opacity: .95; transform: rotate(-7deg) scale(1); }
    72%  { opacity: .95; transform: rotate(-7deg) scale(1); }
    100% { opacity: 0;   transform: rotate(-7deg) scale(1.14); }
  }

  .judge { display: flex; gap: 12px; margin-top: 20px; }
  .judge button {
    flex: 1; padding: 15px 10px; border-radius: 3px;
    font-family: var(--sans); font-size: 15px; font-weight: 700;
    cursor: pointer; border: 1px solid;
  }
  .judge .yes { background: var(--take); border-color: var(--take); color: #fff; }
  .judge .no  { background: transparent; border-color: rgba(242,237,227,.34); color: var(--washi); }
  .judge button:disabled { opacity: .28; cursor: default; }
  .judge button:focus-visible { outline: 2px solid var(--shu); outline-offset: 3px; }

  .progress {
    margin-top: 16px; font-size: 12px; color: var(--mist);
    text-align: center; letter-spacing: .1em;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .hanamaru.draw, .hanamaru.draw path { animation-duration: .01ms; }
    .hanamaru.draw { opacity: 0; }
  }
</style>

        <path class="spiral" d="M69 50 a12 12 0 1 0 -3 20 a19 19 0 1 0 18 -24"/>
      </svg>
    </div>

    <div class="judge">
      <button class="no"  id="j-no">아직이요</button>

    </div>
    <p class="progress" id="progress"></p>
  </section>

</div>

const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ─────────────────────────────────────────────
// 3. 저장하고 불러오기
// ─────────────────────────────────────────────
// 저장소 — 클로드 안에서는 window.storage, 폰/브라우저에서는 localStorage
const hasWinStore = typeof window.storage !== 'undefined'
  && window.storage && typeof window.storage.get === 'function';

const store = {
  async get(k) {
    if (hasWinStore) {
      try { const r = await window.storage.get(k); return r && r.value ? r.value : null; }
      catch (e) { return null; }
    }
    try { return localStorage.getItem(k); } catch (e) { return null; }
  },
  async set(k, v) {
    if (hasWinStore) {
      try { await window.storage.set(k, v); return; } catch (e) {}
    }
    try { localStorage.setItem(k, v); } catch (e) {}
  }
};

async function save() {
  await store.set(KEY, JSON.stringify(words));
}

function seedWords() {
  return SEED.map(([jp, kana, ko, cat]) => ({ jp, kana, ko, cat, hit: 0, id: makeId() }));
}

async function loadWords() {
  let saved = [];
  try {
    const raw = await store.get(KEY);
    if (raw) saved = JSON.parse(raw);
  } catch (e) {}

  if (saved.length === 0) return seedWords();

  // 이미 저장된 단어는 그대로 두고, 새로 늘어난 기본 단어만 뒤에 붙이기
  const have = new Set(saved.map(w => w.jp));
  const extra = seedWords().filter(w => !have.has(w.jp));
  return saved.map(w => ({ ...w, cat: w.cat || 'travel' })).concat(extra);
}

// ─────────────────────────────────────────────
// 4. 화면 그리기
// ─────────────────────────────────────────────
function visible() {
  return filter === 'all' ? words : words.filter(w => w.cat === filter);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function renderChips() {
  const list = [['all', '전체']].concat(Object.keys(CATS).map(k => [k, CATS[k].ko]));
  $('chips').innerHTML = list.map(([key, label]) => {
    const n = key === 'all' ? words.length : words.filter(w => w.cat === key).length;
    return `<button class="chip" data-cat="${key}" aria-pressed="${filter === key}">${label} ${n}</button>`;
  }).join('');
}

function renderList() {
  $('count').textContent = visible().length;
  const ul = $('list');
  const rows = visible();

  if (rows.length === 0) {
    ul.innerHTML = `<li class="empty">
      <span class="big">空</span>
      이 갈래에는 아직 단어가 없어요.<br>위에 하나 넣어보세요.
    </li>`;
    return;
  }

  ul.innerHTML = rows.map(w => `
    <li class="row">
      <span class="jp">${esc(w.jp)}</span>
      ${w.kana ? `<span class="kana">${esc(w.kana)}</span>` : ''}
      <span class="tag">${CATS[w.cat] ? CATS[w.cat].jp : '·'}</span>
      <span class="marks">${'●'.repeat(Math.min(w.hit || 0, 3))}</span>
      <span class="ko">${esc(w.ko)}</span>
      <button class="del" data-id="${w.id}" aria-label="${esc(w.jp)} 지우기">×</button>
    </li>
  `).join('');
}

function renderAll() { renderChips(); renderList(); }

// ─────────────────────────────────────────────
// 5. 갈래 고르기
// ─────────────────────────────────────────────
$('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  filter = chip.dataset.cat;
  renderAll();
  if (!$('panel-quiz').hidden) startQuiz();
});

// ─────────────────────────────────────────────
// 6. 단어 넣기 / 지우기
// ─────────────────────────────────────────────
function addWord() {
  const jp   = $('f-word').value.trim();
  const kana = $('f-kana').value.trim();
  const ko   = $('f-mean').value.trim();
  const cat  = $('f-cat').value;

  if (!jp || !ko) {
    $('note').textContent = '일본어와 뜻은 둘 다 채워주세요.';
    return;
  }

  words.unshift({ jp, kana, ko, cat, hit: 0, id: makeId() });
  save();
  renderAll();

  $('f-word').value = $('f-kana').value = $('f-mean').value = '';
  $('f-word').focus();
  $('note').textContent = `${jp} 담았어요.`;
  setTimeout(() => { $('note').textContent = ''; }, 2200);
}

$('add').addEventListener('click', addWord);
['f-word','f-kana','f-mean'].forEach(id => {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') addWord(); });
});

$('list').addEventListener('click', e => {
  const btn = e.target.closest('.del');
  if (!btn) return;
  words = words.filter(w => w.id !== btn.dataset.id);
  save();
  renderAll();
});

// ─────────────────────────────────────────────
// 7. 탭 전환
// ─────────────────────────────────────────────
function showTab(which) {
  const isQuiz = which === 'quiz';
  $('tab-list').setAttribute('aria-selected', String(!isQuiz));
  $('tab-quiz').setAttribute('aria-selected', String(isQuiz));
  $('panel-list').hidden = isQuiz;
  $('panel-quiz').hidden = !isQuiz;
  if (isQuiz) startQuiz();
}
$('tab-list').addEventListener('click', () => showTab('list'));
$('tab-quiz').addEventListener('click', () => showTab('quiz'));

// ─────────────────────────────────────────────
// 8. 시험
// ─────────────────────────────────────────────
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  queue = shuffle(visible());
  nextCard();
}

function nextCard() {
  $('card').classList.remove('is-flipped');

  if (queue.length === 0) {
    current = null;
    const has = visible().length > 0;
    $('c-kana').textContent = '';
    $('c-word').textContent = has ? '一周' : '空';
    $('c-mean').textContent = has ? '한 바퀴 다 돌았어요' : '이 갈래에는 단어가 없어요';
    $('progress').textContent = has ? '시험 탭을 다시 누르면 처음부터' : '';
    $('j-yes').disabled = $('j-no').disabled = true;
    return;
  }

  current = queue.shift();
  $('j-yes').disabled = $('j-no').disabled = false;
  $('c-kana').textContent = current.kana || '';
  $('c-word').textContent = current.jp;
  $('c-mean').textContent = current.ko;
  $('progress').textContent = `남은 단어 ${queue.length}개`;
}

$('card').addEventListener('click', () => {
  $('card').classList.toggle('is-flipped');
});

$('j-yes').addEventListener('click', () => {
  if (!current) return;
  const found = words.find(w => w.id === current.id);
  if (found) found.hit = (found.hit || 0) + 1;
  save();
  renderList();
  stampHanamaru();
  setTimeout(nextCard, 780);
});

$('j-no').addEventListener('click', () => {
  if (!current) return;
  queue.push(current);   // 모르는 단어는 뒤로 다시 보내기
  nextCard();
});

function stampHanamaru() {
  const m = $('maru');
  m.classList.remove('draw');
  void m.offsetWidth;    // 애니메이션을 처음부터 다시 돌리기 위한 한 줄
  m.classList.add('draw');
}

// ─────────────────────────────────────────────
// 9. 시작
// ─────────────────────────────────────────────
(async function init() {
  words = await loadWords();
  await save();
  renderAll();
})();

// 인터넷 없이도 열리게 하기 (해외에서 데이터 없을 때)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
