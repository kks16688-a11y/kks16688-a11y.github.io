<style>
  /* ===== 색과 글꼴 (구엘 공원 타일에서 가져온 색들) ===== */
  :root {
    --mar:     #143642;   /* 지중해 짙은 청록 — 배경 */
    --cal:     #faf4e8;   /* 석회 벽 흰색 — 카드 */
    --cal-2:   #efe5d3;
    --tinta:   #22201d;   /* 글씨 */
    --ocre:    #e0a526;   /* 황토 */
    --teja:    #c24d3f;   /* 기와 붉은색 */
    --verd:    #4e9b8f;   /* 청동 녹색 */
    --cel:     #6c8ebf;   /* 하늘 파랑 */
    --arena:   #d4b483;   /* 모래 */
    --bruma:   rgba(250,244,232,.55);

    --display: "Abril Fatface", Georgia, serif;
    --sans:    "Noto Sans KR", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--mar);
    color: var(--cal);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 64px; }

  /* ===== 머리말 ===== */
  .masthead {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  }
  .brand-es {
    font-family: var(--display); font-size: 40px; line-height: .95;
    margin: 0; letter-spacing: -.01em;
  }
  .brand-es .mark { color: var(--ocre); }
  .brand-ko { font-size: 12px; letter-spacing: .22em; color: var(--bruma); margin: 10px 0 0; }
  .tally {
    font-family: var(--display); font-size: 12px; color: var(--bruma);
    text-align: right; line-height: 1.6; white-space: nowrap;
  }
  .tally b { display: block; font-size: 30px; color: var(--cal); }

  /* ===== 트렌카디스 — 외운 단어만큼 채워지는 모자이크 띠 ===== */
  .mosaic {
    display: flex; flex-wrap: wrap; gap: 3px;
    margin: 20px 0 6px; padding: 12px;
    background: rgba(0,0,0,.18); border-radius: 3px;
    min-height: 54px; align-content: flex-start;
  }
  .tile {
    height: 13px; border-radius: 1px;
    background: transparent;
    border: 1px solid rgba(250,244,232,.14);
    transition: background .35s ease, border-color .35s ease;
  }
  .tile.set { border-color: transparent; }
  .tile.pop { animation: tilePop .45s cubic-bezier(.3,1.5,.5,1); }
  @keyframes tilePop {
    0%   { transform: scale(.2) rotate(-14deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .mosaic-note {
    font-size: 11px; color: rgba(250,244,232,.4);
    letter-spacing: .12em; margin: 0 0 18px;
  }

  /* ===== 탭 ===== */
  .tabs {
    display: flex; gap: 26px; margin: 0 0 18px;
    border-bottom: 1px solid rgba(250,244,232,.16);
  }
  .tab {
    background: none; border: 0; padding: 0 0 10px;
    font-family: var(--sans); font-size: 15px; font-weight: 500;
    color: var(--bruma); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--cal); border-bottom-color: var(--ocre); }
  .tab:focus-visible { outline: 2px solid var(--ocre); outline-offset: 4px; }

  .panel[hidden] { display: none; }

  /* ===== 갈래 고르기 ===== */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    background: transparent; border: 1px solid rgba(250,244,232,.24);
    color: var(--bruma); border-radius: 2px;
    padding: 7px 14px; font-family: var(--sans); font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--ocre); border-color: var(--ocre);
    color: var(--mar); font-weight: 700;
  }
  .chip:focus-visible { outline: 2px solid var(--cal); outline-offset: 3px; }

  /* ===== 단어 넣는 곳 ===== */
  .composer {
    background: rgba(0,0,0,.16); border: 1px solid rgba(250,244,232,.14);
    border-radius: 3px; padding: 18px; margin-bottom: 24px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 11px; letter-spacing: .16em;
    color: var(--bruma); margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; background: transparent; border: 0;
    border-bottom: 1px solid rgba(250,244,232,.28);
    color: var(--cal); font-family: var(--sans); font-size: 17px; padding: 5px 0;
  }
  .field select option { background: var(--mar); }
  .field input:focus, .field select:focus { outline: 0; border-bottom-color: var(--ocre); }
  .field input::placeholder { color: rgba(250,244,232,.3); }

  .add-btn {
    width: 100%; margin-top: 6px; padding: 12px;
    background: var(--teja); color: #fff; border: 0; border-radius: 2px;
    font-family: var(--sans); font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .add-btn:hover { filter: brightness(1.1); }
  .add-btn:focus-visible { outline: 2px solid var(--cal); outline-offset: 3px; }

  .note { font-size: 12px; color: var(--bruma); margin: 10px 0 0; min-height: 16px; }

  /* ===== 단어 목록 ===== */
  .list { list-style: none; margin: 0; padding: 0; }
  .row {
    display: flex; align-items: baseline; gap: 11px;
    padding: 14px 2px; border-bottom: 1px solid rgba(250,244,232,.1);
  }
  .row .es { font-size: 18px; font-weight: 500; line-height: 1.25; }
  .row .say { font-size: 12px; color: var(--bruma); }
  .row .ko { margin-left: auto; font-size: 14px; color: rgba(250,244,232,.82); text-align: right; }
  .row .del {
    background: none; border: 0; color: rgba(250,244,232,.3);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px;
  }
  .row .del:hover { color: var(--teja); }
  .marks { font-size: 10px; color: var(--ocre); letter-spacing: .12em; }

  .empty {
    padding: 44px 8px; text-align: center;
    color: var(--bruma); font-size: 14px; line-height: 1.9;
  }
  .empty .big {
    display: block; font-family: var(--display); font-size: 44px;
    color: rgba(250,244,232,.24); margin-bottom: 10px;
  }

  /* ===== 시험 카드 ===== */
  .stage { perspective: 1200px; position: relative; }
  .card {
    position: relative; width: 100%; min-height: 250px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.22,.7,.3,1);
    border: 0; padding: 0; background: none; font: inherit; display: block;
  }
  .card.is-flipped { transform: rotateY(180deg); }
  .card:focus-visible { outline: 2px solid var(--ocre); outline-offset: 6px; }

  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    background: var(--cal); color: var(--tinta); border-radius: 2px;
    box-shadow: 0 14px 34px rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px; text-align: center;
  }
  .face.back { transform: rotateY(180deg); background: var(--cal-2); }

  .face .word {
    font-family: var(--display);
    font-size: clamp(30px, 8.5vw, 46px); line-height: 1.1;
  }
  .face .say {
    font-size: 14px; color: rgba(34,32,29,.5);
    letter-spacing: .1em; margin-top: 14px; min-height: 20px;
  }
  .face .meaning { font-size: clamp(20px, 5.5vw, 26px); font-weight: 500; line-height: 1.4; }
  .face .hint {
    position: absolute; bottom: 15px; font-size: 11px;
    letter-spacing: .16em; color: rgba(34,32,29,.35);
  }

  /* 맞혔을 때 타일 조각이 흩어지는 효과 */
  .burst { position: absolute; top: 50%; left: 50%; pointer-events: none; z-index: 4; }
  .shard {
    position: absolute; width: 13px; height: 13px; border-radius: 1px;
    animation: fly .72s cubic-bezier(.15,.7,.4,1) forwards;
  }
  @keyframes fly {
    0%   { transform: translate(0,0) rotate(0) scale(.3); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1); opacity: 0; }
  }

  .judge { display: flex; gap: 12px; margin-top: 20px; }
  .judge button {
    flex: 1; padding: 15px 10px; border-radius: 2px;
    font-family: var(--sans); font-size: 15px; font-weight: 700;
    cursor: pointer; border: 1px solid;
  }
  .judge .yes { background: var(--verd); border-color: var(--verd); color: #fff; }
  .judge .no  { background: transparent; border-color: rgba(250,244,232,.34); color: var(--cal); }
  .judge button:disabled { opacity: .28; cursor: default; }
  .judge button:focus-visible { outline: 2px solid var(--ocre); outline-offset: 3px; }

  .progress {
    margin-top: 16px; font-size: 12px; color: var(--bruma);
    text-align: center; letter-spacing: .1em;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .shard, .tile.pop { animation: none; }
    .shard { opacity: 0; }
  }
</style>

  </section>

  <!-- 시험 -->

    <div class="stage">
      <button class="card" id="card">

          <div class="word" id="c-word">—</div>
          <div class="say" id="c-say"></div>
          <div class="hint">눌러서 뒤집기</div>
        </div>
        <div class="face back">
          <div class="meaning" id="c-mean">—</div>
          <div class="hint">눌러서 되돌리기</div>
        </div>
      </button>
      <div class="burst" id="burst"></div>
    </div>

    <div class="judge">
      <button class="no"  id="j-no">아직이요</button>
      <button class="yes" id="j-yes">알아요</button>
    </div>
    <p class="progress" id="progress"></p>
  </section>

</div>

const KEY = 'es-vocab:words';
const TILE_COLORS = ['var(--ocre)','var(--teja)','var(--verd)','var(--cel)','var(--arena)'];

let words   = [];
let filter  = 'all';
let queue   = [];
let current = null;

const $ = id => document.getElementById(id);
const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ─────────────────────────────────────────────
// 3. 저장하고 불러오기
// ─────────────────────────────────────────────
// 저장소 — 클로드 안에서는 window.storage, 폰/브라우저에서는 localStorage
const hasWinStore = typeof window.storage !== 'undefined'
  && window.storage && typeof window.storage.get === 'function';

const store = {
  async get(k) {
    if (hasWinStore) {
      try { const r = await window.storage.get(k); return r && r.value ? r.value : null; }
      catch (e) { return null; }
    }
    try { return localStorage.getItem(k); } catch (e) { return null; }
  },
  async set(k, v) {
    if (hasWinStore) {
      try { await window.storage.set(k, v); return; } catch (e) {}
    }
    try { localStorage.setItem(k, v); } catch (e) {}
  }
};

async function save() {
  await store.set(KEY, JSON.stringify(words));
}

function seedWords() {
  return SEED.map(([es, say, ko, cat]) => ({ es, say, ko, cat, hit: 0, id: makeId() }));
}

async function loadWords() {
  let saved = [];
  try {
    const raw = await store.get(KEY);
    if (raw) saved = JSON.parse(raw);
  } catch (e) {}

  if (saved.length === 0) return seedWords();

  // 저장된 단어는 그대로 두고, 새로 늘어난 기본 단어만 뒤에 붙이기
  const have = new Set(saved.map(w => w.es));
  return saved.concat(seedWords().filter(w => !have.has(w.es)));
}

// ─────────────────────────────────────────────
// 4. 화면 그리기
// ─────────────────────────────────────────────
function visible() {
  return filter === 'all' ? words : words.filter(w => w.cat === filter);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// 트렌카디스 모자이크: 단어 하나 = 타일 하나, 외우면 색이 들어옴
function renderMosaic(popId) {
  const rows = visible();
  const done = rows.filter(w => (w.hit || 0) > 0).length;

  $('mosaic').innerHTML = rows.map((w, i) => {
    const width  = 15 + ((i * 7) % 5) * 4;          // 조각마다 폭을 다르게
    const filled = (w.hit || 0) > 0;
    const color  = TILE_COLORS[i % TILE_COLORS.length];
    const pop    = w.id === popId ? ' pop' : '';
    return `<span class="tile${filled ? ' set' + pop : ''}"
      style="width:${width}px;${filled ? `background:${color};` : ''}"></span>`;
  }).join('');

  $('mosaic-note').textContent = rows.length
    ? `${done} / ${rows.length} 조각이 채워졌어요`
    : '';
}

function renderChips() {
  const list = [['all','전체']].concat(Object.keys(CATS).map(k => [k, CATS[k]]));
  $('chips').innerHTML = list.map(([key, label]) => {
    const n = key === 'all' ? words.length : words.filter(w => w.cat === key).length;
    return `<button class="chip" data-cat="${key}" aria-pressed="${filter === key}">${label} ${n}</button>`;
  }).join('');
}

function renderList() {
  $('count').textContent = visible().length;
  const ul = $('list');
  const rows = visible();

  if (rows.length === 0) {
    ul.innerHTML = `<li class="empty"><span class="big">¿?</span>
      이 갈래에는 아직 단어가 없어요.<br>위에 하나 넣어보세요.</li>`;
    return;
  }

  ul.innerHTML = rows.map(w => `
    <li class="row">
      <span class="es">${esc(w.es)}</span>
      ${w.say ? `<span class="say">${esc(w.say)}</span>` : ''}
      <span class="marks">${'◆'.repeat(Math.min(w.hit || 0, 3))}</span>
      <span class="ko">${esc(w.ko)}</span>
      <button class="del" data-id="${w.id}" aria-label="${esc(w.es)} 지우기">×</button>
    </li>
  `).join('');
}

function renderAll(popId) { renderChips(); renderMosaic(popId); renderList(); }

// ─────────────────────────────────────────────
// 5. 갈래 고르기
// ─────────────────────────────────────────────
$('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  filter = chip.dataset.cat;
  renderAll();
  if (!$('panel-quiz').hidden) startQuiz();
});

// ─────────────────────────────────────────────
// 6. 단어 넣기 / 지우기
// ─────────────────────────────────────────────
function addWord() {
  const es  = $('f-word').value.trim();
  const say = $('f-say').value.trim();
  const ko  = $('f-mean').value.trim();
  const cat = $('f-cat').value;

  if (!es || !ko) {
    $('note').textContent = '스페인어와 뜻은 둘 다 채워주세요.';
    return;
  }

  words.unshift({ es, say, ko, cat, hit: 0, id: makeId() });
  save();
  renderAll();

  $('f-word').value = $('f-say').value = $('f-mean').value = '';
  $('f-word').focus();
  $('note').textContent = `${es} 담았어요.`;
  setTimeout(() => { $('note').textContent = ''; }, 2200);
}

$('add').addEventListener('click', addWord);
['f-word','f-say','f-mean'].forEach(id => {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') addWord(); });
});

$('list').addEventListener('click', e => {
  const btn = e.target.closest('.del');
  if (!btn) return;
  words = words.filter(w => w.id !== btn.dataset.id);
  save();
  renderAll();
});

// ─────────────────────────────────────────────
// 7. 탭 전환
// ─────────────────────────────────────────────
function showTab(which) {
  const isQuiz = which === 'quiz';
  $('tab-list').setAttribute('aria-selected', String(!isQuiz));
  $('tab-quiz').setAttribute('aria-selected', String(isQuiz));
  $('panel-list').hidden = isQuiz;
  $('panel-quiz').hidden = !isQuiz;
  if (isQuiz) startQuiz();
}
$('tab-list').addEventListener('click', () => showTab('list'));
$('tab-quiz').addEventListener('click', () => showTab('quiz'));

// ─────────────────────────────────────────────
// 8. 시험
// ─────────────────────────────────────────────
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  queue = shuffle(visible());
  nextCard();
}

function nextCard() {
  $('card').classList.remove('is-flipped');

  if (queue.length === 0) {
    current = null;
    const has = visible().length > 0;
    $('c-say').textContent = '';
    $('c-word').textContent = has ? '¡Olé!' : '¿?';
    $('c-mean').textContent = has ? '한 바퀴 다 돌았어요' : '이 갈래에는 단어가 없어요';
    $('progress').textContent = has ? '시험 탭을 다시 누르면 처음부터' : '';
    $('j-yes').disabled = $('j-no').disabled = true;
    return;
  }

  current = queue.shift();
  $('j-yes').disabled = $('j-no').disabled = false;
  $('c-word').textContent = current.es;
  $('c-say').textContent = current.say || '';
  $('c-mean').textContent = current.ko;
  $('progress').textContent = `남은 단어 ${queue.length}개`;
}

$('card').addEventListener('click', () => {
  $('card').classList.toggle('is-flipped');
});

$('j-yes').addEventListener('click', () => {
  if (!current) return;
  const found = words.find(w => w.id === current.id);
  if (found) found.hit = (found.hit || 0) + 1;
  save();
  breakTiles();
  renderAll(current.id);
  setTimeout(nextCard, 700);
});

$('j-no').addEventListener('click', () => {
  if (!current) return;
  queue.push(current);   // 모르는 단어는 뒤로 다시 보내기
  nextCard();
});

// 타일 조각이 흩어지는 효과
function breakTiles() {
  const box = $('burst');
  box.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const angle = (Math.PI * 2 * i) / 9 + Math.random() * .4;
    const dist  = 70 + Math.random() * 55;
    const s = document.createElement('span');
    s.className = 'shard';
    s.style.background = TILE_COLORS[i % TILE_COLORS.length];
    s.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
    s.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
    s.style.setProperty('--rot', `${Math.random() * 300 - 150}deg`);
    box.appendChild(s);
  }
  setTimeout(() => { box.innerHTML = ''; }, 800);
}

// ─────────────────────────────────────────────
// 9. 시작
// ─────────────────────────────────────────────
(async function init() {
  words = await loadWords();
  await save();
  renderAll();
})();

// 인터넷 없이도 열리게 하기 (해외에서 데이터 없을 때)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
